<dialog id="alias-confirmation-dialog" class="confirmation-dialog">
    <div class="confirmation-dialog-content">
        <div class="confirmation-icon" aria-hidden="true">!</div>
        <h2>Confirm alias change</h2>
        <p id="alias-confirmation-message"></p>
        <p class="confirmation-warning">
            Alias changes affect future parcel matching.
        </p>
        <div class="confirmation-actions">
            <button
                id="cancel-alias-change"
                class="secondary-button"
                type="button"
            >
                Cancel
            </button>
            <button
                id="confirm-alias-change"
                class="primary-button"
                type="button"
            >
                Yes, continue
            </button>
        </div>
    </div>
</dialog>
